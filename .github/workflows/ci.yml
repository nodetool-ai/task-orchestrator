name: CI

# The one pipeline (red-CI incident, 2026-07-17: deploys used to run in a
# separate push-triggered workflow and shipped every red push):
#
#   quality (typecheck + full vitest)          ← the gate everything waits on
#     └─► server / runner deploys              ← push to main + code changed
#
# quality is also the check the GitHub-driven task lifecycle keys off
# (testing -> passing/failing) and the gate `gh pr merge --auto` waits on.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    # The vitest suite migrates + seeds a real Postgres per fork (see
    # vitest.setup.ts, DATABASE_URL -> localhost:5433). Stand one up as a
    # service on the same host:port the suite defaults to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: taskorch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:devpw@localhost:5433/taskorch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # lib/worker-bundle.ts reads dist/run-worker.standalone.js at call time,
      # and __tests__/sprites-provider.test.ts exercises the paths that call it
      # (SpritesRunnerProvider.create/resume). dist/ is gitignored and the
      # bundle is only produced by this script, which otherwise runs in the
      # worker-bundle job *after* quality — so without this step the suite
      # tests a checkout where the file cannot exist and five tests fail on
      # ENOENT. It is ~2s of esbuild: the gate builds its own artifact.
      - name: Build standalone worker bundle
        run: npm run build:worker:standalone

      - name: Test
        run: npm test

  # The terminal cockpit (tui/) is its own package with its own deps, so it is
  # excluded from the root tsconfig the way mobile/ is, and its vitest suite is
  # not in the root `include`. Without this job it would have no CI at all.
  # Hermetic: no Postgres, no server — the client tests use loopback servers.
  tui:
    name: tui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Packaging (T-tui-10): the `orch` bundle is built from tui/node_modules
      # alone (esbuild is a tui devDependency), so it belongs in this job and
      # not in `quality`. The smoke test is deliberately not asserting on verb
      # semantics — it guards the one thing bundling can break: a runtime
      # module-resolution failure in a directory with no node_modules.
      - name: Build orch bundle
        run: npm run build:orch

      - name: Bundle smoke test (standalone, no node_modules)
        run: |
          d=$(mktemp -d)
          cp ../dist/orch.js "$d/orch.js"
          cd "$d"
          rc=0
          out=$(./orch.js --help 2>&1) || rc=$?
          echo "exit=$rc"
          echo "$out"
          case "$out" in
            *ERR_MODULE_NOT_FOUND*|*"Cannot find package"*|*"Dynamic require of"*)
              echo "bundle is not self-contained"; exit 1 ;;
          esac
          [ "$rc" -le 2 ] || { echo "bundle crashed (exit $rc)"; exit 1; }

  # Deploy gating: docs-only pushes skip the Fly deploys (the old fly-deploy
  # workflow's paths-ignore, reproduced as a diff so deploys can live behind
  # `needs: quality`).
  changes:
    name: detect code changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          # Force-push / first push: before is unknown — fall back to the parent.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="${{ github.sha }}^"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fly control-plane deploy — only after quality is green ────────────────
  server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (server)
        run: flyctl deploy --config fly.toml --remote-only --ha=false --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Standalone worker bundle artifact ─────────────────────────────────────
  # Builds the single-file worker (dist/run-worker.standalone.js) and publishes
  # it as a per-SHA workflow artifact: bundle + sha256 + a small manifest naming
  # the worker SHA it was built from. This artifact exists so a future
  # fetch-at-launch step (spec §6, 2026-07-18-standalone-worker-bundle-design)
  # has a published, checksummed artifact to consume. Not on the deploy path —
  # a failure here blocks nothing.
  worker-bundle:
    name: Publish worker bundle artifact
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build standalone bundle
        run: npm run build:worker:standalone
      - name: Isolation smoke test (bundle alone in an empty dir must exit 2)
        run: |
          d=$(mktemp -d)
          cp dist/run-worker.standalone.js "$d/run-worker.js"
          cd "$d"
          rc=0; node run-worker.js >/dev/null 2>&1 || rc=$?
          [ "$rc" -eq 2 ] || { echo "bundle isolation check failed (exit $rc, expected 2)"; exit 1; }
      - name: Checksum + manifest
        run: |
          cd dist
          sha256sum run-worker.standalone.js > run-worker.standalone.js.sha256
          printf '{"workerSha":"%s","builtAt":"%s","bytes":%s}\n' \
            "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(stat -c%s run-worker.standalone.js)" > worker-bundle.json
          cat run-worker.standalone.js.sha256 worker-bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/run-worker.standalone.js
            dist/run-worker.standalone.js.sha256
            dist/worker-bundle.json
