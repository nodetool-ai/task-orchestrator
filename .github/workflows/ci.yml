name: CI

# The one pipeline (red-CI incident, 2026-07-17: deploys used to run in a
# separate push-triggered workflow and shipped every red push):
#
#   quality (typecheck + full vitest)          ← the gate everything waits on
#     └─► server / runner deploys              ← push to main + code changed
#           └─► warm-box-template              ← pre-build the box template for
#                                                the freshly deployed SHA so no
#                                                first dispatch waits ~15 min
#
# quality is also the check the GitHub-driven task lifecycle keys off
# (testing -> passing/failing) and the gate `gh pr merge --auto` waits on.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    # The vitest suite migrates + seeds a real Postgres per fork (see
    # vitest.setup.ts, DATABASE_URL -> localhost:5433). Stand one up as a
    # service on the same host:port the suite defaults to.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpw
          POSTGRES_DB: taskorch
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:devpw@localhost:5433/taskorch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Deploy gating: docs-only pushes skip the Fly deploys (the old fly-deploy
  # workflow's paths-ignore, reproduced as a diff so deploys can live behind
  # `needs: quality`).
  changes:
    name: detect code changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          # Force-push / first push: before is unknown — fall back to the parent.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE="${{ github.sha }}^"
          fi
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Fly deploys — only after quality is green ─────────────────────────────
  #   • server — releases the web/control-plane app (fly.toml)
  #   • runner — rebuilds + pushes the per-run worker image (fly.runner.toml,
  #     registry.fly.io/task-orchestrator-runners:latest). build-only.
  # App-scoped deploy tokens:
  #   fly tokens create deploy -a task-orchestrator          -> FLY_API_TOKEN
  #   fly tokens create deploy -a task-orchestrator-runners  -> FLY_RUNNER_API_TOKEN
  server:
    name: Deploy server
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (server)
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  runner:
    name: Build + push runner image
    runs-on: ubuntu-latest
    needs: [quality, changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-runner-image
        with:
          fly-registry-token: ${{ secrets.FLY_RUNNER_API_TOKEN }}
          gh-token: ${{ secrets.REPO_CACHE_GH_TOKEN }}
          repo-cache-repos: ${{ vars.REPO_CACHE_REPOS }}

  # Pre-build the box template ("environment") for the SHA that just went green
  # and deployed, so the first dispatch never waits out the ~15-minute cold
  # build. Requires a TASK_ORCH_API_TOKEN repo secret (create one at /tokens on
  # the control plane); skips politely when the secret is absent or the
  # deployment has no Box configured (503).
  warm-box-template:
    name: Warm box template
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - name: Kick app-managed box template build
        env:
          URL: ${{ vars.TASK_ORCH_URL || 'https://tasks.nodetool.ai' }}
          TOKEN: ${{ secrets.TASK_ORCH_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "TASK_ORCH_API_TOKEN secret not set; skipping template warm."
            exit 0
          fi
          # The server restarts right after deploy; retry while it comes up.
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST "$URL/api/environments/build" \
              -H "Authorization: Bearer $TOKEN" -H "content-type: application/json" \
              -d '{"provider":"box"}') || code=000
            echo "attempt $i -> HTTP $code: $(head -c 300 /tmp/resp.json 2>/dev/null)"
            case "$code" in
              202) echo "template build kicked for the deployed SHA"; exit 0 ;;
              409) echo "already building/ready for this SHA — nothing to do"; exit 0 ;;
              503) echo "Box not configured on this deployment — skipping"; exit 0 ;;
              400|401) echo "warm request rejected"; exit 1 ;;
              *) sleep 15 ;;
            esac
          done
          echo "server did not accept the warm request in time"
          exit 1
