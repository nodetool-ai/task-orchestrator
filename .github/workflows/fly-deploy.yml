name: Deploy to Fly

# Auto-deploy on every push to main (docs-only pushes skipped):
#   • server  — releases the web/control-plane app (fly.toml)
#   • runner  — rebuilds + pushes the per-run worker image (fly.runner.toml,
#               registry.fly.io/task-orchestrator-runners:latest) so new runs
#               never boot stale worker code. build-only: no machine released.
# The two jobs run in parallel and each uses its own app-scoped deploy token:
#   fly tokens create deploy -a task-orchestrator          -> FLY_API_TOKEN
#   fly tokens create deploy -a task-orchestrator-runners  -> FLY_RUNNER_API_TOKEN
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  server:
    name: Deploy server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (server)
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  runner:
    name: Build + push runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (runner image, build-only)
        # Carry the repo-mirror seed inputs too, so push-to-main rebuilds ship a
        # fresh seed. Build the flag list in shell so an unset var/secret simply
        # omits the flag — an empty --build-secret would fail the deploy.
        run: |
          set -euo pipefail
          args=()
          if [ -n "${REPO_CACHE_REPOS:-}" ]; then
            args+=(--build-arg "REPO_CACHE_REPOS=${REPO_CACHE_REPOS}")
          fi
          # Pre-warm the target repo's deps (npm ci + Playwright) into the image.
          # Bust the prewarm layer per push so it reflects the latest nodetool.
          args+=(--build-arg "PREWARM_BUST=${{ github.sha }}")
          if [ -n "${PREWARM_REPO:-}" ]; then
            args+=(--build-arg "PREWARM_REPO=${PREWARM_REPO}")
          fi
          if [ -n "${REPO_CACHE_GH_TOKEN:-}" ]; then
            args+=(--build-secret "gh_token=${REPO_CACHE_GH_TOKEN}")
          fi
          flyctl deploy --config fly.runner.toml -a task-orchestrator-runners \
            --dockerfile Dockerfile.fly-runner \
            --build-only --push --image-label latest --remote-only \
            "${args[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RUNNER_API_TOKEN }}
          REPO_CACHE_REPOS: ${{ vars.REPO_CACHE_REPOS }}
          REPO_CACHE_GH_TOKEN: ${{ secrets.REPO_CACHE_GH_TOKEN }}
          PREWARM_REPO: ${{ vars.PREWARM_REPO }}
