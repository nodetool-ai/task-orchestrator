name: Deploy to Fly

# Auto-deploy the Task Orchestrator web server on every push to main.
# Requires a deploy-scoped token in the FLY_API_TOKEN repo secret:
#   fly tokens create deploy -a task-orchestrator
# Docs-only pushes are skipped. The runner image (fly.runner.toml /
# Dockerfile.fly-runner) is NOT rebuilt here — run ./scripts/fly-deploy.sh
# (or a manual runner push) when runner code changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: fly-deploy-server
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (server)
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
