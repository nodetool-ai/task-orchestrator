name: Nightly runner image rebuild

# Rebuilds + pushes the per-run worker image once a night so the image-baked
# repo mirrors (blobless bare clones under /opt/repo-cache) stay fresh — the
# smaller the mirror lag, the smaller each per-run delta fetch. A failed nightly
# only degrades to bigger fetches on the next run; it never breaks runs.
#
# Required repo settings:
#   • Actions variable REPO_CACHE_REPOS   — space/comma-separated owner/repo list
#     to seed. When unset, no mirrors are baked (runs full-clone).
#   • secret REPO_CACHE_GH_TOKEN          — read-only contents token for the seed
#     clones. When unset, no mirrors are baked.
#   • secret FLY_RUNNER_API_TOKEN         — already used by fly-deploy.yml.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  runner:
    name: Build + push runner image (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: fly deploy (runner image, build-only)
        # Build the flag list in shell so an unset var/secret simply omits the
        # flag — an empty --build-secret would fail the deploy.
        run: |
          set -euo pipefail
          args=()
          if [ -n "${REPO_CACHE_REPOS:-}" ]; then
            args+=(--build-arg "REPO_CACHE_REPOS=${REPO_CACHE_REPOS}")
            # Cache-bust the mirror-seeding layer: with no new commits since the
            # last build, every layer cache-hits and the "fresh" nightly image
            # would ship the same stale mirrors. See REPO_CACHE_BUST in
            # Dockerfile.fly-runner.
            args+=(--build-arg "REPO_CACHE_BUST=$(date -u +%Y%m%dT%H%M%SZ)")
          fi
          if [ -n "${REPO_CACHE_GH_TOKEN:-}" ]; then
            args+=(--build-secret "gh_token=${REPO_CACHE_GH_TOKEN}")
          fi
          flyctl deploy --config fly.runner.toml -a task-orchestrator-runners \
            --dockerfile Dockerfile.fly-runner \
            --build-only --push --image-label latest --remote-only \
            "${args[@]}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_RUNNER_API_TOKEN }}
          REPO_CACHE_REPOS: ${{ vars.REPO_CACHE_REPOS }}
          REPO_CACHE_GH_TOKEN: ${{ secrets.REPO_CACHE_GH_TOKEN }}
