name: "Build runner image"
description: >-
  Build the Fly per-run worker image on the GitHub Actions runner (BuildKit,
  with GitHub Actions layer cache) and push it to registry.fly.io. Replaces the
  Depot/remote-builder path so the multi-GB nodetool prewarm has 16 GB of RAM
  and a reusable layer cache.

inputs:
  fly-registry-token:
    description: "Fly deploy token with push access to registry.fly.io/task-orchestrator-runners."
    required: true
  gh-token:
    description: "contents:read token for cloning target repos. Passed as the BuildKit secret 'gh_token'. Empty = mirrors/prewarm skip (image still builds)."
    required: false
    default: ""
  repo-cache-repos:
    description: "Space/comma-separated owner/repo list to bake as blobless mirrors. Empty = none."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # The image is multi-GB; the stock runner's ~14 GB free disk is tight once
    # BuildKit holds context + intermediate layers + the final image. Reclaim
    # ~20 GB of preinstalled toolchains we don't use.
    - name: Free up disk space
      shell: bash
      run: |
        echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') free"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
          "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
        sudo docker image prune -af 2>/dev/null || true
        echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') free"

    # The prewarm/repo-cache layers are keyed on nodetool's HEAD SHA (see
    # *_BUST in Dockerfile.fly-runner). Resolving it here means those layers
    # cache-hit — skipping the expensive nodetool `npm ci` — whenever nodetool
    # itself hasn't advanced since the last build. Public repo, no auth needed.
    - name: Resolve nodetool HEAD (prewarm cache key)
      id: nodetool
      shell: bash
      run: |
        sha="$(git ls-remote https://github.com/nodetool-ai/nodetool.git HEAD | cut -f1)"
        echo "nodetool HEAD: ${sha:-<unresolved>}"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    # `flyctl auth docker` writes registry.fly.io credentials into the Docker
    # config from FLY_API_TOKEN — the supported way to push to Fly's registry.
    - uses: superfly/flyctl-actions/setup-flyctl@master
    - name: Authenticate Docker to Fly registry
      shell: bash
      run: flyctl auth docker
      env:
        FLY_API_TOKEN: ${{ inputs.fly-registry-token }}

    - name: Build + push runner image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile.fly-runner
        push: true
        tags: registry.fly.io/task-orchestrator-runners:latest
        # Fly Machines have intermittently attempted to unpack the BuildKit
        # attestation manifest (unknown/unknown platform) as if it were a
        # runnable image. Push a plain image manifest instead.
        provenance: false
        # GitHub Actions layer cache (per-repo, ~10 GB budget). mode=max caches
        # intermediate layers too, so the cached nodetool prewarm layer is
        # reusable across builds — that's the whole point of keying the bust on
        # the nodetool SHA above.
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # PREWARM_REPO is intentionally omitted so the Dockerfile default
        # (nodetool-ai/nodetool) applies — passing an empty value would override
        # it and disable the prewarm.
        build-args: |
          REPO_CACHE_REPOS=${{ inputs.repo-cache-repos }}
          REPO_CACHE_BUST=${{ steps.nodetool.outputs.sha }}
          PREWARM_BUST=${{ steps.nodetool.outputs.sha }}
        secrets: |
          gh_token=${{ inputs.gh-token }}
