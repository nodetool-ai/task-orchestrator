name: "Build runner image"
description: >-
  Build the Fly per-run worker image with flyctl deploy --build-only --push so
  the runner app's registry.fly.io latest tag is updated in the same way Fly
  Machines resolve runnable images.

inputs:
  fly-registry-token:
    description: "Fly deploy token with push access to registry.fly.io/task-orchestrator-runners."
    required: true
  gh-token:
    description: "contents:read token for cloning target repos. Passed as the BuildKit secret 'gh_token'. Empty = mirrors/prewarm skip (image still builds)."
    required: false
    default: ""
  repo-cache-repos:
    description: "Space/comma-separated owner/repo list to bake as blobless mirrors. Empty = none."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # Keep some free space for flyctl's context packaging and any local Docker
    # cleanup the hosted runner needs before invoking the remote Fly builder.
    - name: Free up disk space
      shell: bash
      run: |
        echo "before: $(df -h --output=avail / | tail -1 | tr -d ' ') free"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
          "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" 2>/dev/null || true
        sudo docker image prune -af 2>/dev/null || true
        echo "after:  $(df -h --output=avail / | tail -1 | tr -d ' ') free"

    # Repo-cache layers are keyed on nodetool's HEAD SHA (see *_BUST in
    # Dockerfile.fly-runner). Public repo, no auth needed.
    - name: Resolve nodetool HEAD (prewarm cache key)
      id: nodetool
      shell: bash
      run: |
        sha="$(git ls-remote https://github.com/nodetool-ai/nodetool.git HEAD | cut -f1)"
        echo "nodetool HEAD: ${sha:-<unresolved>}"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

    - uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Build + push runner image
      shell: bash
      run: |
        args=(
          --config fly.runner.toml
          --app task-orchestrator-runners
          --dockerfile Dockerfile.fly-runner
          --build-only
          --push
          --remote-only
          --image-label latest
          --build-arg "REPO_CACHE_REPOS=${REPO_CACHE_REPOS}"
          --build-arg "REPO_CACHE_BUST=${NODETOOL_SHA}"
          --build-arg "PREWARM_BUST=${NODETOOL_SHA}"
        )
        if [ -n "${GH_TOKEN}" ]; then
          args+=(--build-secret "gh_token=${GH_TOKEN}")
        fi
        flyctl deploy "${args[@]}"
      env:
        FLY_API_TOKEN: ${{ inputs.fly-registry-token }}
        GH_TOKEN: ${{ inputs.gh-token }}
        NODETOOL_SHA: ${{ steps.nodetool.outputs.sha }}
        REPO_CACHE_REPOS: ${{ inputs.repo-cache-repos }}
